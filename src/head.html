<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book1 - Excel</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#107c41">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --xl-green:#217346; --xl-green-dark:#185c37;
  --title-green:#107c41; --title-green-dark:#0e6b38; --search-pill:#cfe2d8;
  --fg:#1b1b1b; --muted:#6b6b6b; --border:#d0d0d0; --border-soft:#e6e6e6;
  --ribbon-bg:#ffffff; --ribbon-hover:#f0f0f0; --ribbon-active:#e1efe6;
  --tabbar-bg:#f3f2f1; --tab-inactive:#4a4a4a;
  --grid-line:#e0e0e0; --hdr-bg:#f0f0f0; --hdr-fg:#616161; --hdr-active:#d8e8de;
  --sel:#217346; --sel-fill:rgba(33,115,70,.10);
  --cell-bg:#ffffff; --canvas-bg:#ffffff;
  --fx-bg:#ffffff; --status-bg:#f3f2f1; --status-fg:#444;
  --dialog-bg:#ffffff; --menu-bg:#ffffff; --menu-hover:#f0f0f0;
}
[data-theme="dark"]{
  --fg:#e8e8e8; --muted:#a0a0a0; --border:#4a4a4a; --border-soft:#3a3a3a;
  --ribbon-bg:#252526; --ribbon-hover:#333334; --ribbon-active:#2f4038;
  --tabbar-bg:#1f1f20; --tab-inactive:#b0b0b0;
  --grid-line:#4a4a4a; --hdr-bg:#2d2d2e; --hdr-fg:#cfcfcf; --hdr-active:#37503f;
  --sel:#4caf7d; --sel-fill:rgba(76,175,125,.16);
  --cell-bg:#1e1e1e; --canvas-bg:#1e1e1e;
  --fx-bg:#1e1e1e; --status-bg:#1f1f20; --status-fg:#c8c8c8;
  --dialog-bg:#2a2a2b; --menu-bg:#2a2a2b; --menu-hover:#3a3a3b;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; overflow:hidden;}
body{font-family:"Segoe UI",Calibri,system-ui,sans-serif; color:var(--fg); background:var(--cell-bg); font-size:13px;}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
input,select,textarea{font:inherit; color:inherit;}
#app{display:flex; flex-direction:column; height:100vh;}

/* ---------- title bar ---------- */
#titlebar{background:var(--title-green); color:#fff; display:flex; align-items:center; height:48px; padding:0 8px; gap:7px; flex:none; font-size:12px;}
#xl-icon{width:17px; height:17px; display:flex; align-items:center; justify-content:center; opacity:.95;}
#xl-icon svg{display:block;}
.tb-chev{color:#fff; font-size:8px; opacity:.85; margin-left:-2px; margin-right:2px;}
.as-label{font-size:12px; opacity:.95;}
.as-toggle{width:32px; height:16px; border-radius:8px; border:1.5px solid #fff; position:relative; flex:none; margin-right:4px; background:rgba(255,255,255,.12);}
.as-toggle .knob{position:absolute; top:1px; left:1px; width:11px; height:11px; border-radius:50%; background:#fff; transition:left .12s;}
.as-toggle[aria-pressed="true"]{background:rgba(255,255,255,.28);}
.as-toggle[aria-pressed="true"] .knob{left:17px;}
#titlebar .qat{display:flex; align-items:center; gap:2px;}
.tb-btn{color:#fff; padding:3px 5px; border-radius:2px; font-size:14px; line-height:18px; opacity:.95; display:flex; align-items:center;}
.tb-btn svg{display:block;}
.tb-btn:hover{background:rgba(255,255,255,.18);}
#titlebar .docblock{display:flex; align-items:center; gap:7px; margin-left:6px; white-space:nowrap; overflow:hidden;}
#titlebar .doctitle{font-size:12px; font-weight:600; letter-spacing:.1px;}
#titlebar .savestate{font-size:11.5px; opacity:.85;}
#titlebar .chev{font-size:10px; opacity:.7;}
#titlebar .tbspacer{flex:1;}
#tellme{display:flex; align-items:center; gap:6px; background:var(--search-pill); border-radius:4px; padding:0 10px; height:26px; min-width:190px;}
#tellme .mag{flex:none; opacity:.8;}
#tellme input{border:none; outline:none; background:transparent; width:100%; font-size:12px; color:#0b3d22;}
#tellme input::placeholder{color:#2f6b47;}
#account{width:24px; height:24px; border-radius:50%; background:#fff; color:var(--title-green); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;}

/* ---------- tab strip ---------- */
#tabs{background:var(--tabbar-bg); display:flex; align-items:stretch; height:29px; flex:none; padding-left:4px; padding-right:6px;}
.tab{padding:0 12px; font-size:12.5px; color:var(--tab-inactive); display:flex; align-items:center; border-bottom:2px solid transparent;}
.tab:hover{background:rgba(0,0,0,.05);}
.tab.active{color:#1b1b1b; font-weight:600; border-bottom:2px solid var(--xl-green);}
.tab.file-tab{font-weight:400;}
.tab.file-tab:hover{background:rgba(0,0,0,.05);}

/* ---------- ribbon ---------- */
#ribbon-wrap{flex:none; background:var(--ribbon-bg); border-bottom:1px solid var(--border); overflow-x:auto; overflow-y:hidden;}
#ribbon{display:none; padding:2px 3px 0; flex-wrap:nowrap; align-items:stretch; min-height:105px;}
#ribbon.active{display:flex;}
.rgroup{display:flex; flex:0 0 auto; flex-direction:column; justify-content:flex-start; padding:0 7px 0; border-right:1px solid #dcdcdc; position:relative;}
.rgroup:last-child{border-right:none;}
.rgroup .glabel{font-size:9.5px; color:var(--muted); text-align:center; line-height:11px; margin-top:auto; white-space:nowrap;}
.rgroup .launcher{position:absolute; right:2px; bottom:14px; font-size:9px; color:var(--muted); opacity:.6; padding:0 1px; line-height:9px;}
.rgroup .launcher:hover{opacity:1; color:var(--xl-green);}
.grow{display:flex; flex-wrap:wrap; gap:1px; align-items:flex-start; align-content:flex-start; max-width:430px;}
.gcol{display:flex; flex-direction:column; gap:1px;}
.rbtn{display:flex; flex-direction:column; align-items:center; gap:1px; padding:3px 5px; border-radius:2px; font-size:10.5px; line-height:12px; color:var(--fg); text-align:center; min-width:40px;}
.rbtn:hover{background:var(--ribbon-hover);}
.rbtn.on{background:var(--ribbon-active);}
.rbtn:disabled{opacity:.45;}
.rbtn .ic{font-size:15px; line-height:17px; display:flex; align-items:center; justify-content:center;}
.rbtn .ic svg{width:16px; height:16px; display:block;}
.rbtn.ico .ic svg{width:14px; height:14px;}
.rbtn.small .ic svg{width:14px; height:14px;}
.rbtn.big .ic svg{width:26px; height:26px;}
.colorbtn .ic svg{width:14px; height:14px;}
.pitem .pi svg{width:13px; height:13px; vertical-align:-2px;}
.rbtn.small{flex-direction:row; gap:3px; min-width:0; padding:2px 4px; font-size:10.5px; text-align:left; white-space:nowrap;}
.rbtn.small .ic{font-size:13px;}
.grows{display:flex; flex-direction:column; justify-content:flex-start; gap:1px;}
.grow-row{display:flex; align-items:center; gap:2px;}
.gstack{display:flex; flex-direction:column; gap:1px; max-width:84px;}
.rbtn.ico{width:22px; height:20px; min-width:22px; padding:0; justify-content:center; position:relative; border-radius:2px;}
.rbtn.ico .ic{font-size:12px; line-height:14px;}
.rbtn.ico.tiny .ic{font-size:8px; line-height:9px; letter-spacing:-.2px; font-weight:600;}
.rbtn.ico .ar{position:absolute; right:0; bottom:0; font-size:6px; line-height:6px; opacity:.75;}
.rbtn.big{width:56px; min-width:0; padding:2px 1px; font-size:9.5px; line-height:10.5px; word-break:break-word; position:relative;}
.rbtn.big .ar{font-size:8px; line-height:8px; opacity:.85; margin-left:1px;}
.rbtn.big .ic{font-size:15px; line-height:16px;}
.rsel{padding:0 2px; border:1px solid var(--border); border-radius:2px; background:var(--cell-bg); font-size:11.5px; height:21px;}
.rsel.w{width:126px;}
.rsel.n{width:48px;}
.rsel.s{width:132px;}
.splitbtn{display:flex; align-items:center; gap:2px; padding:2px 4px; border-radius:2px; font-size:11.5px;}
.splitbtn:hover{background:var(--ribbon-hover);}
.splitbtn .ar{font-size:8px; color:var(--muted);}
.colorbtn{display:flex; flex-direction:column; align-items:center; gap:1px; padding:2px 4px; width:26px; border-radius:2px; font-size:10.5px; line-height:12px;}
.colorbtn:hover{background:var(--ribbon-hover);}
.colorbtn .bar{width:17px; height:3px; border-radius:1px; margin-top:1px;}
@media (max-width:1420px){
  .rbtn.big{width:54px; font-size:9px;}
  .rbtn.ico{width:19px; height:19px; min-width:19px;}
  .rsel.w{width:92px;} .rsel.s{width:94px;}
  .rbtn.small{font-size:10.5px; padding:1px 3px; gap:3px;}
}
@media (max-width:1300px){
  .rbtn.big{width:54px; font-size:9px; line-height:10px;}
  .rbtn.small{padding:1px 3px; font-size:10.5px; gap:3px;}
  .rsel.w{width:104px;} .rsel.s{width:112px;} .rsel.n{width:44px;}
}

/* ---------- formula bar ---------- */
#fxbar{flex:none; display:flex; align-items:center; background:var(--fx-bg); border-bottom:1px solid var(--border); height:22px;}
#namewrap{position:relative; display:flex; align-items:center; border-right:1px solid var(--border);}
#namesel{width:112px; height:22px; border:none; background:transparent; padding:0 18px 0 6px; font-size:12px;}
#namewrap .nmchev{position:absolute; right:4px; font-size:8px; color:var(--muted); pointer-events:none;}
#fxbtns{display:flex; border-right:1px solid var(--border);}
.fxbtn{width:24px; height:22px; font-size:12px; color:var(--muted);}
.fxbtn:hover{background:var(--ribbon-hover);}
#fxinput{flex:1; height:22px; border:none; padding:0 6px; background:transparent; color:var(--fg); font-size:12.5px; outline:none;}
#fxinput:focus{box-shadow:inset 0 0 0 1px var(--sel);}

/* ---------- grid ---------- */
#gridwrap{flex:1; overflow:auto; position:relative; background:var(--canvas-bg);}
#gridtable{border-collapse:collapse; table-layout:fixed; background:var(--cell-bg);}
#gridtable th{background:var(--hdr-bg); color:var(--hdr-fg); border:1px solid var(--grid-line); font-weight:400; font-size:11.5px; position:sticky; z-index:5; user-select:none;}
#gridtable thead th{top:0; height:20px; cursor:col-resize; text-align:center;}
#gridtable tbody th{left:0; width:40px; min-width:40px; cursor:row-resize; text-align:center;}
#gridtable th.corner{left:0; z-index:6; cursor:default;}
#gridtable th.hdr-hl{background:var(--hdr-active); color:var(--xl-green); font-weight:600;}
#gridtable td{border:1px solid var(--grid-line); padding:0 3px; height:20px; overflow:hidden; white-space:nowrap; font-size:13px; cursor:cell; vertical-align:middle;}
#gridtable td.sel{outline:2px solid var(--sel); outline-offset:-2px;}
#gridtable td.inrange{background-color:var(--sel-fill);}
#gridtable td.merged-cell{display:none;}
#gridtable td.wrap{white-space:normal; word-break:break-word;}
#cellinput{position:absolute; display:none; border:2px solid var(--sel); padding:0 2px; font-size:13px; background:var(--cell-bg); color:var(--fg); z-index:20; outline:none; font-family:inherit;}
.fillhd{position:absolute; width:6px; height:6px; background:var(--sel); border:1px solid #fff; z-index:21; cursor:crosshair;}

/* ---------- bottom bar ---------- */
#bottom{flex:none; display:flex; align-items:center; background:var(--status-bg); border-top:1px solid var(--border); height:22px;}
#sheettabs{display:flex; align-items:center; gap:0; overflow-x:auto; flex:1; padding-left:2px;}
.navbtn{width:20px; height:20px; font-size:10px; color:var(--muted);}
.navbtn:hover{background:var(--ribbon-hover);}
.shbtn{padding:2px 10px; font-size:11.5px; white-space:nowrap; color:var(--fg); border-bottom:2px solid transparent;}
.shbtn:hover{background:var(--ribbon-hover);}
.shbtn.active{background:var(--cell-bg); color:var(--xl-green); font-weight:600; border-bottom:2px solid var(--xl-green);}
#sheetadd{font-size:14px; padding:0 8px; color:var(--xl-green); line-height:18px;}
#statusbar{display:flex; align-items:center; gap:10px; padding:0 8px; font-size:11.5px; color:var(--status-fg); white-space:nowrap;}
#st-sum{color:var(--muted);}
.viewbtns{display:flex; gap:1px;}
.viewbtns button{width:20px; height:18px; font-size:11px; color:var(--muted); border-radius:2px;}
.viewbtns button.on{background:var(--ribbon-active); color:var(--xl-green);}
#zoomslider{width:78px;}
#zoomlabel{min-width:34px; text-align:right;}

/* ---------- popovers, menus, dialogs ---------- */
.popover{position:fixed; background:var(--menu-bg); border:1px solid var(--border); border-radius:2px; box-shadow:0 4px 14px rgba(0,0,0,.18); padding:3px 0; z-index:100; display:none; min-width:150px;}
.popover.show{display:block;}
.pitem{display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:5px 12px; font-size:12.5px;}
.pitem:hover{background:var(--menu-hover);}
.pitem .pi{width:14px; text-align:center; opacity:.75;}
.psep{border-top:1px solid var(--border-soft); margin:3px 0;}
.swgrid{display:grid; grid-template-columns:repeat(10,18px); gap:2px; padding:4px 6px;}
.sw{width:18px; height:18px; cursor:pointer; border:1px solid rgba(0,0,0,.12);}
.sw:hover{outline:2px solid var(--xl-green);}
dialog{background:var(--dialog-bg); color:var(--fg); border:1px solid var(--border); border-radius:2px; box-shadow:0 8px 32px rgba(0,0,0,.3); padding:0; min-width:380px; max-width:94vw; max-height:88vh;}
dialog::backdrop{background:rgba(0,0,0,.25);}
dialog h3{font-size:13px; font-weight:600; padding:8px 14px; border-bottom:1px solid var(--border-soft); background:var(--tabbar-bg);}
dialog .dbody{padding:14px;}
dialog .row{display:flex; align-items:center; gap:8px; margin:7px 0;}
dialog .row > label{min-width:104px; font-size:12.5px; color:var(--muted);}
dialog input[type=text],dialog input[type=number],dialog select{flex:1; padding:3px 6px; border:1px solid var(--border); border-radius:2px; background:var(--cell-bg); color:var(--fg); font-size:12.5px;}
dialog .actions{display:flex; justify-content:flex-end; gap:8px; padding:9px 14px; border-top:1px solid var(--border-soft); background:var(--tabbar-bg);}
.btn{padding:4px 14px; border-radius:2px; font-size:12.5px; border:1px solid var(--border); background:var(--cell-bg);}
.btn.primary{background:var(--xl-green); color:#fff; border-color:var(--xl-green);}
.btn:hover{filter:brightness(.97);}
#findres{font-size:11.5px; color:var(--muted); margin-top:6px;}
.chartbox{position:absolute; z-index:15; border:1px solid var(--border); background:var(--cell-bg); box-shadow:0 3px 10px rgba(0,0,0,.15);}
.chartbox .cbar{display:flex; justify-content:flex-end; padding:1px 3px; border-bottom:1px solid var(--border-soft);}
.chartbox .cbar button{font-size:11px; color:var(--muted);}

/* ---------- backstage ---------- */
#backstage{position:fixed; inset:0; background:var(--dialog-bg); z-index:200; display:none; flex-direction:column;}
#backstage.show{display:flex;}
#backstage header{background:var(--xl-green); color:#fff; padding:7px 14px; display:flex; justify-content:space-between; align-items:center; font-size:13px;}
#backstage .body{display:flex; flex:1; min-height:0;}
#backstage nav{width:190px; background:var(--tabbar-bg); padding:12px 0; border-right:1px solid var(--border-soft);}
#backstage nav button{display:block; width:100%; text-align:left; padding:8px 20px; font-size:13px;}
#backstage nav button:hover{background:var(--ribbon-hover);}
#backstage nav button.sel{background:var(--ribbon-bg); color:var(--xl-green); font-weight:600; box-shadow:inset 3px 0 0 var(--xl-green);}
#backstage .content{flex:1; padding:24px 32px; overflow:auto;}
.mru-item{display:block; width:100%; text-align:left; padding:8px 10px; border:1px solid var(--border-soft); margin:4px 0; font-size:12.5px;}
.mru-item:hover{background:var(--ribbon-hover);}
kbd{border:1px solid var(--border); border-radius:2px; padding:0 4px; font-size:11px; background:var(--tabbar-bg);}

/* ---------- workbook bar ---------- */
#wbtabs{flex:none; display:flex; align-items:stretch; gap:2px; background:var(--tabbar-bg);
  border-bottom:1px solid var(--border); padding:0 4px; height:30px; overflow-x:auto; overflow-y:hidden;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;}
#wbtabs::-webkit-scrollbar{display:none;}
.wbtab{display:flex; align-items:center; gap:5px; padding:0 10px; height:26px; margin-top:2px;
  border:1px solid var(--border); border-bottom:none; border-radius:3px 3px 0 0;
  background:var(--cell-bg); color:var(--tab-inactive); font-size:11.5px; white-space:nowrap;
  max-width:190px; flex:0 0 auto; cursor:pointer;}
.wbtab .wbnm{overflow:hidden; text-overflow:ellipsis;}
.wbtab.active{background:var(--ribbon-bg); color:var(--fg); font-weight:600;
  box-shadow:inset 0 -2px 0 var(--xl-green);}
.wbtab .wbdirty{color:#c00000; font-size:14px; line-height:1;}
.wbtab .wbclose{font-size:10px; opacity:.5; padding:0 1px; border-radius:2px;}
.wbtab .wbclose:hover{opacity:1; background:var(--ribbon-hover); color:#c00000;}
.wbtab.add,.wbtab.split,.wbtab.newwin{justify-content:center; min-width:30px; padding:0 8px;
  font-size:13px; color:var(--muted); background:transparent; border:none; margin-top:3px;}
.wbtab.add:hover,.wbtab.split:hover,.wbtab.newwin:hover{background:var(--ribbon-hover); color:var(--fg);}
.wbtab.split.on{color:var(--xl-green); font-weight:700;}

/* ---------- side-by-side split ---------- */
#app.splitting #gridwrap{display:none;}
#splitwrap{flex:1 1 auto; display:flex; min-height:0; overflow:hidden; background:var(--cell-bg);}
#pane-left,#pane-right{display:flex; flex-direction:column; min-width:0; overflow:hidden;}
#pane-right{border-left:1px solid var(--border);}
.panebar{flex:none; height:24px; display:flex; align-items:center; padding:0 8px;
  background:var(--hdr-bg); border-bottom:1px solid var(--border); font-size:11.5px; font-weight:600;
  color:var(--hdr-fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.panegrid{flex:1 1 auto; overflow:auto; -webkit-overflow-scrolling:touch;}
table.splitgrid{border-collapse:collapse; table-layout:fixed; font-size:12px;}
table.splitgrid th{background:var(--hdr-bg); color:var(--hdr-fg); font-weight:400;
  border:1px solid var(--grid-line); height:20px; min-width:44px; font-size:11px;}
table.splitgrid td{border:1px solid var(--grid-line); height:20px; padding:0 4px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--fg);}
#split-divider{flex:0 0 8px; cursor:col-resize; background:var(--tabbar-bg);
  display:flex; align-items:center; justify-content:center; touch-action:none;}
#split-divider span{width:2px; height:34px; background:var(--border); border-radius:1px;}
#split-divider:hover{background:var(--ribbon-hover);}

/* ---------- Android / touch ---------- */
/* Bigger tap targets, safe-area padding, and no tap highlight on Android WebView. */
@media (pointer:coarse){
  .rbtn{min-height:34px; padding:4px 6px;}
  .rbtn.ico{width:36px; height:34px; min-width:36px;}
  .rbtn.big{width:64px; min-height:48px;}
  .rbtn.small{min-height:34px; padding:4px 6px;}
  .tab{padding:0 16px; min-height:40px; font-size:13.5px;}
  .wbtab{height:34px; margin-top:3px; font-size:12.5px; padding:0 12px;}
  .wbtab .wbclose{font-size:13px; padding:2px 4px;}
  #zoomslider{width:120px;}
  .fxbtn{width:38px; height:34px;}
  #namesel{height:34px; font-size:14px;}
  #fxinput{height:34px; font-size:14px;}
  #cellinput{font-size:15px;}
  .navbtn,.shbtn{min-height:32px; padding:0 10px;}
}
html,body{-webkit-tap-highlight-color:transparent; overscroll-behavior:none;}
#app{padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}
@media screen and (max-width:820px){
  /* Phones: the ribbon scrolls horizontally instead of wrapping to a second row. */
  #ribbon-wrap{overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;}
  #ribbon{flex-wrap:nowrap; min-width:max-content;}
  .panegrid{font-size:11px;}
  table.splitgrid th{min-width:38px;}
}
@media screen and (max-width:560px){
  #titlebar .qat,.tbspacer{display:none;}
  .docblock{max-width:44vw; overflow:hidden;}
  .doctitle{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #tellme{display:none;}
}
/* Standalone/TWA: no browser chrome means we must not rely on the address bar. */
@media (display-mode:standalone){
  #app{height:100vh; height:100dvh;}
}

@media print{
  #titlebar,#tabs,#wbtabs,#ribbon-wrap,#fxbar,#bottom,#backstage,#cellinput,.chartbox .cbar,#splitwrap{display:none !important;}
  #gridwrap{overflow:visible !important;}
  body,#app{height:auto; overflow:visible;}
  #gridtable th{background:#f2f2f2 !important;}
}
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
